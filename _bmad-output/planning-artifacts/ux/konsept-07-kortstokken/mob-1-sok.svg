<text x="28.0" y="79.0" font-size="12"><tspan font-weight="700" fill="#73550C">DEMOMODUS</tspan><tspan font-weight="500" fill="#73550C"> · Værscenario: Godt vær</tspan></text>
<text x="28.0" y="96.0" font-size="12" font-weight="500" fill="#73550C">«nå» = man. 9. nov. 13:30</text>
<text x="16.0" y="152.0" font-size="27" font-weight="600" fill="#2A241D">Hvor lenge vil du gå?</text>
<text x="16.0" y="180.0" font-size="15" font-weight="400" fill="#5C5348">Si når du vil gå og hvor lang tid du har. Vi veier</text><text x="16.0" y="202.0" font-size="15" font-weight="400" fill="#5C5348">værmeldingen og foreslår opptil tre turer i</text><text x="16.0" y="224.0" font-size="15" font-weight="400" fill="#5C5348">Moldemarka som passer, og forteller hvorfor.</text>
