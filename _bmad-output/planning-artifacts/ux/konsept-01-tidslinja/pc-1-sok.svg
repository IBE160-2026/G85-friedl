<text x="64.0" y="610.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#525A62" style="font-variant-numeric: tabular-nums">Rammen er Tidsvinduet ditt: Starttidspunkt pluss Tilgjengelig tid. Den flytter seg når du endrer skjemaet.</text>
