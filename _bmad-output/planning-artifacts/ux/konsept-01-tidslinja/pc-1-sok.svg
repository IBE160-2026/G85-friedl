<text x="168.0" y="22.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#FFFFFF" style="font-variant-numeric: tabular-nums">· Værscenario: Godt vær · «nå» = man. 9. nov. 13:30</text>
<text x="64.0" y="76.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" fill="#1C2126" font-weight="700" letter-spacing="-0.4" style="font-variant-numeric: tabular-nums">Turplanlegger</text>
<text x="236.0" y="76.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#525A62" style="font-variant-numeric: tabular-nums">Fotturer i Moldemarka, veid mot været og tiden du har</text>
<line x1="64.0" y1="100.0" x2="1376.0" y2="100.0" stroke="#D3D0C8" stroke-width="1"/>
<text x="64.0" y="196.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="40" fill="#1C2126" font-weight="700" letter-spacing="-0.8" style="font-variant-numeric: tabular-nums">Når vil du gå, og hvor lang tid har du?</text>
<text x="64.0" y="232.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#525A62" style="font-variant-numeric: tabular-nums">Si når du vil gå og hvor lang tid du har. Vi veier værmeldingen og foreslår opptil tre turer i Moldemarka</text>
<text x="64.0" y="256.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#525A62" style="font-variant-numeric: tabular-nums">som passer, og forteller hvorfor.</text>
