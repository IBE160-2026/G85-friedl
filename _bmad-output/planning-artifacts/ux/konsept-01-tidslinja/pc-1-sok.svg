<text x="332.0" y="476.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#525A62" style="font-variant-numeric: tabular-nums">Alle felt har standardverdier, så du kan trykke rett på Finn tur.</text>
<text x="332.0" y="496.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#525A62" style="font-variant-numeric: tabular-nums">Samme Søk og samme Værmelding gir alltid samme svar.</text>
