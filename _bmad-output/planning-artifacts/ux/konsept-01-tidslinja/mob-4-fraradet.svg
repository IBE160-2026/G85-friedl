<text x="16.0" y="850.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#1C2126" style="font-variant-numeric: tabular-nums">Én frarådet time i Tidsvinduet gjelder hele</text>
<text x="16.0" y="867.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#1C2126" style="font-variant-numeric: tabular-nums">Tidsvinduet. Vind fra 17,2 m/s (sterk kuling)</text>
