xt', Avenir, 'Helvetica Neue', sans-serif" font-size="12" font-weight="500" fill="#A6BCBF">Turer: morotur.no og Fjord Norway</text><text x="16.0" y="1051.5" font-family="'Avenir Next', Avenir, 'Helvetica Neue', sans-serif" font-size="12" font-weight="500" fill="#A6BCBF">Bakgrunnskart: © Kartverket</text><line x1="0.0" y1="844.0" x2="390.0" y2="844.0" stroke="#E6EFEE" stroke-width="1" stroke-dasharray="6 5" opacity="0.7"/><rect x="272.0" y="824.0" width="110.0" height="17.0" fill="#0C181B"/><text x="378.0" y="837.0" font-family="'DIN Alternate', 'DIN Condensed', 'Helvetica Neue', sans-serif" font-size="11" fill="#E6EFEE" text-anchor="end" letter-spacing="0.5">skjermkant 844</text></svg>