1.5" stroke-dasharray="2.5 2.5"/><text x="715.0" y="512.0" font-family="'Avenir Next', Avenir, 'Helvetica Neue', sans-serif" font-size="14" font-weight="600" fill="#E6EFEE">Vann</text><text x="715.0" y="528.0" font-family="'Avenir Next', Avenir, 'Helvetica Neue', sans-serif" font-size="13" fill="#A6BCBF">slått av</text><text x="76.0" y="614.0" font-family="'Avenir Next', Avenir, 'Helvetica Neue', sans-serif" font-size="14.5" fill="#A6BCBF">Værskiva står i ytterste felt. Da slår vi av de andre målerne: frarådet går foran alt, også foran den korteste Turen.</text><rect x="76.0" y="668.0" width="784.0" height="150.0" fill="#081417" stroke="#3B5960" stroke-width="1" rx="6"/><text x="96.0" y="700.0" font-family="'DIN Alternate', 'DIN Condensed', 'Helvetica Neue', sans-serif" font-size="11" fill="#A6BCBF" letter-spacing="1.5">ALTERNATIV  ·  BEDRE TIDSVINDU</text><path d="M772.01,727.32 A26,26 0 0 1 779.14,710.10" fill="none" stroke="#5FC4A8" stroke-width="7"/><path d="M780.10,709.14 A26,26 0 0 1 797.32,702.01" fill="none" stroke="#D6C15C" stroke-width="5" opacity="0.3"/><path d="M798.68,702.01 A26,26 0 0 1 815.90,709.14" fill="none" stroke="#EC9558" stroke-width="5" opacity="0.3"/><path d="M816.86,710.10 A26,26 0 0 1 823.99,727.32" fill="none" stroke="#F47F8E" stroke-width="5" opacity="0.3"/><line x1="798.0" y1="728.0" x2="778.6" y2="720.0" stroke="#E6EFEE" stroke-width="2"/><circle cx="798.0" cy="728.0" r="3.0" fill="#E6EFEE"/><text x="96.0" y="732.0" font-family="'Avenir Next', Avenir, 'Helvetica Neue', sans-serif" font-size="21" font-weight="600" fill="#E6EFEE">I morgen (søn. 15. nov.) fra kl. 11:00</text><text x="96.0" y="756.0" font-family="'Avenir Next', Avenir, 'Helvetica Neue', sans-serif" font-size="14" fill="#A6BCBF">Samme Tilgjengelig tid, 2 t. Værklassen er bedre da.</text><rect x="96.0" y="768.0" width="230.0" height="44.0" fill="#F0B54A" rx="6"/><text x="211.0" y="795.8" font-family="'Avenir Next', Avenir, 'Helvetica Neue', sans-serif" font-size="16" font-weight="600" fill="#0C181B" text-anchor="middle">Bruk i morgen 11:00</text><text x="344.0" y="796.0" font-family="'Avenir Next', Avenir, 'Helvetica Neue', sans-serif" font-size="14" font-weight="500" fill="#E6EFEE">Sjekk også MET sine farevarsler.</text><rect x="912.0" y="222.0" width="480.0" height="640.0" fill="none" stroke="#22383F" stroke-width="1" rx="8"/><text x="936.0" y="260.0" font-family="'DIN Alternate', 'DIN Condensed', 'Helvetica Neue', sans-serif" font-size="11" fill="#A6BCBF" letter-spacing="1.5">SLIK KOM VI FRAM TIL DETTE</text><text x="936.0" y="294.0" font-family="'DIN Alternate', 'DIN Condensed', 'Helvetica Neue', sans-serif" font-size="10.5" fill="#A6BCBF" letter-spacing="1.3">VIND I TIDSVINDUET</text><text x="936.0" y="320.0" font-family="'DIN Alternate', 'DIN Condensed', 'Helvetica Neue', sans-serif" font-size="22" fill="#E6EFEE">opp mot 19 m/s</text><text x="936.0" y="338.0" font-family="'Avenir Next', Avenir, 'Helvetica Neue', sans-serif" font-size="12" fill="#A6BCBF">sterk kuling</text><text x="936.0" y="378.0" font-family="'DIN Alternate', 'DIN Condensed', 'Helvetica Neue', sans-serif" font-size="10.5" fill="#A6BCBF" letter-spacing="1.3">VÆRKLASSE</text><text x="936.0" y="404.0" font-family="'DIN Alternate', 'DIN Condensed', 'Helvetica Neue', sans-serif" font-size="22" fill="#F47F8E">frarådet</text><text x="936.0" y="422.0" font-family="'Avenir Next', Avenir, 'Helvetica Neue', sans-serif" font-size="12" fill="#A6BCBF">ytterste felt på skiva</text><text x="936.0" y="462.0" font-family="'DIN Alternate', 'DIN Condensed', 'Helvetica Neue', sans-serif" font-size="10.5" fill="#A6BCBF" letter-spacing="1.3">TURFORSLAG</text><text x="936.0" y="488.0" font-family="'DIN Alternate', 'DIN Condensed', 'Helvetica Neue', sans-serif" font-size="22" fill="#E6EFEE">ingen</text><text x="936.0" y="506.0" font-family="'Avenir Next', Avenir, 'Helvetica Neue', sans-serif" font-size="12" fill="#A6BCBF">frarådet går foran alt</text><line x1="936.0" y1="530.0" x2="1368.0" y2="530.0" stroke="#22383F" stroke-width="1"/><text x="936.0" y="554.0" font-family="'Avenir Next', Avenir, 'Helvetica Neue', sans-serif" font-size="14" fill="#A6BCBF">Værmelding for ca. 400 moh. På toppene kan det være kaldere og</text><text x="936.0" y="575.0" font-family="'Avenir Next', Avenir, 'Helvetica Neue', sans-serif" font-size="14" fill="#A6BCBF">mer vind.</text><text x="936.0" y="610.0" font-family="'Avenir Next', Avenir, 'Helvetica Neue', sans-serif" font-size="14" fill="#E6EFEE">Dette er et riktig svar, ikke en feil. Prøv Bedre tidsvindu, eller endre</text><text x="936.0" y="631.0" font-family="'Avenir Next', Avenir, 'Helvetica Neue', sans-serif" font-size="14" fill="#E6EFEE">Søket.</text><rect x="936.0" y="660.0" width="150.0" height="44.0" fill="none" stroke="#3B5960" stroke-width="1.5" rx="6"/><text x="1011.0" y="687.4" font-family="'Avenir Next', Avenir, 'Helvetica Neue', sans-serif" font-size="15" font-weight="600" fill="#E6EFEE" text-anchor="middle">Endre søk</text><text x="936.0" y="838.0" font-family="'Avenir Next', Avenir, 'Helvetica Neue', sans-serif" font-size="12.5" font-weight="500" fill="#A6BCBF">Værdata: MET Norway</text><rect x="48.0" y="886.0" width="840.0" height="64.0" fill="none" stroke="#22383F" stroke-width="1" rx="6"/><text x="64.0" y="910.0" font-family="'Avenir Next', Avenir, 'Helvetica Neue', sans-serif" font-size="13" fill="#A6BCBF">Du har selv ansvaret for å vurdere forholdene. Værvurderingen er veiledende og vurderer ikke føre (snø, is, gjørme). Følg MET sine</text><text x="64.0" y="929.0" font-family="'Avenir Next', Avenir, 'Helvetica Neue', sans-serif" font-size="13" fill="#A6BCBF">farevarsler.</text><line x1="0.0" y1="990.0" x2="1440.0" y2="990.0" stroke="#22383F" stroke-width="1"/><text x="48.0" y="1022.0" font-family="'Avenir Next', Avenir, 'Helvetica Neue', sans-serif" font-size="12.5" font-weight="500" fill="#A6BCBF">Værdata: MET Norway   ·   Turstier: Turrutebasen, Kartverket   ·   Turer: morotur.no og Fjord Norway   ·   Bakgrunnskart: © Kartverket</text><text x="1392.0" y="1022.0" font-family="'Avenir Next', Avenir, 'Helvetica Neue', sans-serif" font-size="12" fill="#A6BCBF" text-anchor="end">Kilde for hvert Turforslag: lenke på kortet</text></svg>