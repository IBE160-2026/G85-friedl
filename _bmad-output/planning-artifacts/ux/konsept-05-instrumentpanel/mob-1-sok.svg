t', Avenir, 'Helvetica Neue', sans-serif" font-size="24" font-weight="600" fill="#E6EFEE">Finn en tur i Moldemarka</text><text x="16.0" y="162.0" font-family="'Avenir Next', Avenir, 'Helvetica Neue', sans-serif" font-size="24" font-weight="600" fill="#E6EFEE">som passer været og tiden din.</text><text x="16.0" y="190.0" font-family="'Avenir Next', Avenir, 'Helvetica Neue', sans-serif" font-size="14" fill="#A6BCBF">Si når du vil gå og hvor lang tid du har. Vi veier</text><text x="16.0" y="210.0" font-family="'Avenir Next', Avenir, 'Helvetica Neue', sans-serif" font-size="14" fill="#A6BCBF">værmeldingen og foreslår opptil tre turer som passer,</text><text x="16.0" y="230.0" font-family="'Avenir Next', Avenir, 'Helvetica Neue', sans-serif" font-size="14" fill="#A6BCBF">og forteller hvorfor.</text><text x="16.0" y="264.0" font-family="'Avenir Next', Avenir, 'Helvetica Neue', sans-serif" font-size="15" font-weight="600" fill="#E6EFEE">Turdag</text><rect x="16.0" y="274.0" width="175.0" height="48.0" fill="#18343C" stroke="#8CCFE0" stroke-width="2" rx="6"/><text x="30.0" y="304.0" font-family="'Avenir Next', Avenir, 'Helvetica Neue', sans-serif" font-size="15" font-weight="600" fill="#E6EFEE">I dag</text><text x="179.0" y="304.0" font-family="'DIN Alternate', 'DIN Condensed', 'Helvetica Neue', sans-serif" font-size="12.5" fill="#A6BCBF" text-anchor="end">man. 9. nov.</text><rect x="199.0" y="274.0" width="175.0" height="48.0" fill="none" stroke="#3B5960" stroke-width="1.5" rx="6"/><text x="213.0" y="304.0" font-family="'Avenir Next', Avenir, 'Helvetica Neue', sans-serif" font-size="15" font-weight="500" fill="#E6EFEE">I morgen</text><text x="16.0" y="358.0" font-family="'Avenir Next', Avenir, 'Helvetica Neue', sans-serif" font-size="15" font-weight="600" fill="#E6EFEE">Starttidspunkt</text><text x="374.0" y="358.0" font-family="'Avenir Next', Avenir, 'Helvetica Neue', sans-serif" font-size="12.5" fill="#A6BCBF" text-anchor="end">nå, rundet opp</text><rect x="16.0" y="368.