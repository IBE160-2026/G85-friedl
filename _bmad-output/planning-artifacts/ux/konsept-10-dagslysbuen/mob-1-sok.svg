ll="#EEE8DA">utsikt</text><rect x="135.5" y="670.0" width="96.7" height="44.0" rx="22.0" fill="#121C25" stroke="#3B4C5A" stroke-width="1.4"/><path d="M151.5 690.0 q3.8 -3.0 7.5 0 t7.5 0" fill="none" stroke="#BAC4CB" stroke-width="1.4" stroke-linecap="round"/><path d="M151.5 694.5 q3.8 -3.0 7.5 0 t7.5 0" fill="none" stroke="#BAC4CB" stroke-width="1.4" stroke-linecap="round"/><text x="175.5" y="697.0" font-family="Optima, 'Iowan Old Style', sans-serif" font-size="15" font-weight="400" fill="#EEE8DA">vann</text><rect x="16.0" y="734.0" width="358.0" height="54.0" rx="27.0" fill="#F4C76A"/><text x="195.0" y="767.5" font-family="Futura, 'Avenir Next', sans-serif" font-size="18" font-weight="600" fill="#1A1406" text-anchor="middle">Finn tur</text><text x="16.0" y="828.0" font-family="Futura, 'Avenir Next', sans-serif" font-size="15" font-weight="500" fill="#EEE8DA">Slik leser du buen</text><text x="16.0" y="854.0" font-family="Optima, 'Iowan Old Style', sans-serif" font-size="13.5" font-weight="400" fill="#BAC4CB">Buen er sola over Turdagen, fra 08:30 til 15:59.</text><text x="16.0" y="880.0" font-family="Optima, 'Iowan Old Style', sans-serif" font-size="13.5" font-weight="400" fill="#BAC4CB">Den stiplede rammen er Tidsvinduet ditt.</text><text x="16.0" y="906.0" font-family="Optima, 'Iowan Old Style', sans-serif" font-size="13.5" font-weight="400" fill="#BAC4CB">Den oransje streken er mørkegrensen, 30 min før</text><text x="16.0" y="925.0" font-family="Optima, 'Iowan Old Style', sans-serif" font-size="13.5" font-weight="400" fill="#BAC4CB">solnedgang. Ender Turen etter den, får den</text><text x="16.0" y="944.0" font-family="Optima, 'Iowan Old Style', sans-serif" font-size="13.5" font-weight="400" fill="#BAC4CB">Mørkevarsel.</text><text x="16.0" y="970.0" font-family="Optima, 'Iowan Old Style', sans-serif" font-size="13.5" font-weight="400" fill="#BAC4CB">Båndet under buen viser Værklassen i Tidsvinduet,</text><text x="16.0" y="989.0" font-family="Optima, 'Iowan Old Style', sans-serif" font-size="13.5" font-weight="400" fill="#BAC4CB">alltid med tekst.</text><line x1="16.0" y1="1019.0" x2="374.0" y2="1019.0" stroke="#2A3946" stroke-width="1"/><text x="16.0" y="1045.0" font-family="Optima, 'Iowan Old Style', sans-serif" font-size="12.5" font-weight="400" fill="#BAC4CB">Værdata: MET Norway</text><text x="16.0" y="1064.0" font-family="Optima, 'Iowan Old Style', sans-serif" font-size="12.5" font-weight="400" fill="#BAC4CB">Turstier: Turrutebasen, Kartverket</text><text x="16.0" y="1083.0" font-family="Optima, 'Iowan Old Style', sans-serif" font-size="12.5" font-weight="400" fill="#BAC4CB">Turer: morotur.no og Fjord Norway</text><text x="16.0" y="1102.0" font-family="Optima, 'Iowan Old Style', sans-serif" font-size="12.5" font-weight="400" fill="#BAC4CB">Bakgrunnskart: © Kartverket</text><line x1="0.0" y1="844.0" x2="390.0" y2="844.0" stroke="#BAC4CB" stroke-width="1" stroke-dasharray="6 4"/><text x="384.0" y="840.0" font-family="'Avenir Next', Futura, sans-serif" font-size="10.5" font-weight="600" fill="#BAC4CB" text-anchor="end" style="font-variant-numeric:tabular-nums" stroke="#0C131A" stroke-width="4" stroke-linejoin="round" paint-order="stroke">skjermkant 844</text></svg>