<text x="58" y="885" font-family="'Avenir Next', 'Helvetica Neue', sans-serif" font-size="13" font-weight="500" fill="#16201B">Værvurderingen er veiledende og vurderer ikke</text>
<text x="58" y="904" font-family="'Avenir Next', 'Helvetica Neue', sans-serif" font-size="13" font-weight="500" fill="#16201B">føre (snø, is, gjørme). Følg MET sine farevarsler.</text>
