<text x="82" y="580" font-family="'Avenir Next', 'Helvetica Neue', sans-serif" font-size="16" font-weight="700" fill="#16201B">I morgen (søn. 15. nov.) fra kl.</text>
<text x="82" y="600" font-family="'Avenir Next', 'Helvetica Neue', sans-serif" font-size="16" font-weight="700" fill="#16201B">11:00</text>
