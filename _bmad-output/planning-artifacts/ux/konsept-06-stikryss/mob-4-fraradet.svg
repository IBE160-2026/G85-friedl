<text x="102" y="746" font-family="'DIN Condensed', 'Avenir Next Condensed', sans-serif" font-size="14" font-weight="700" fill="#3D4741" letter-spacing="1">VÆR I TIDSVINDUET 10:00–12:00</text>
<text x="102" y="768" font-family="'Avenir Next', 'Helvetica Neue', sans-serif" font-size="17" font-weight="700" fill="#16201B">Vind opp mot 19 m/s</text>
<text x="102" y="786" font-family="'Avenir Next', 'Helvetica Neue', sans-serif" font-size="13" font-weight="500" fill="#3D4741">sterk kuling, avgjorde Værklassen</text>
<text x="102" y="804" font-family="'Avenir Next', 'Helvetica Neue', sans-serif" font-size="12" font-weight="500" fill="#3D4741">Værmelding for ca. 400 moh. På toppene</text>
<text x="102" y="818" font-family="'Avenir Next', 'Helvetica Neue', sans-serif" font-size="12" font-weight="500" fill="#3D4741">kan det være kaldere og mer vind.</text>
