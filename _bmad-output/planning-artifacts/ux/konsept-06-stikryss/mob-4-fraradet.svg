<text x="30" y="322" font-family="'DIN Condensed', 'Avenir Next Condensed', sans-serif" font-size="60" font-weight="700" fill="#16201B" letter-spacing="1.5">VENT.</text>
<text x="30" y="354" font-family="'DIN Condensed', 'Avenir Next Condensed', sans-serif" font-size="30" font-weight="700" fill="#16201B" letter-spacing="0.8">VIND OPP MOT 19 M/S.</text>
<text x="30" y="386" font-family="'Avenir Next', 'Helvetica Neue', sans-serif" font-size="16" font-weight="600" fill="#16201B">Værklasse frarådet: det er meldt sterk</text>
<text x="30" y="408" font-family="'Avenir Next', 'Helvetica Neue', sans-serif" font-size="16" font-weight="600" fill="#16201B">kuling, vind opp mot 19 m/s i Tidsvinduet</text>
<text x="30" y="430" font-family="'Avenir Next', 'Helvetica Neue', sans-serif" font-size="16" font-weight="600" fill="#16201B">ditt (10:00–12:00).</text>
<text x="30" y="456" font-family="'Avenir Next', 'Helvetica Neue', sans-serif" font-size="14" font-weight="500" fill="#3D4741">Derfor foreslår vi ingen Tur nå, heller ikke den</text>
<text x="30" y="476" font-family="'Avenir Next', 'Helvetica Neue', sans-serif" font-size="14" font-weight="500" fill="#3D4741">korteste. Frarådet går foran alt annet.</text>
<text x="30" y="504" font-family="'Avenir Next', 'Helvetica Neue', sans-serif" font-size="14" font-weight="700" fill="#16201B">Sjekk også MET sine farevarsler.</text>
