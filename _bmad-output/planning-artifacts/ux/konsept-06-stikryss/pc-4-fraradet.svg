<text x="84" y="210" font-family="'Avenir Next', 'Helvetica Neue', sans-serif" font-size="16" font-weight="600" fill="#16201B">I dag, lør. 14. nov.</text>
<text x="235.052" y="190" font-family="'Avenir Next Condensed', 'Avenir Next', sans-serif" font-size="13" font-weight="600" fill="#3D4741">Starttidspunkt</text>
<text x="235.052" y="210" font-family="'Avenir Next', 'Helvetica Neue', sans-serif" font-size="16" font-weight="600" fill="#16201B">10:00</text>
