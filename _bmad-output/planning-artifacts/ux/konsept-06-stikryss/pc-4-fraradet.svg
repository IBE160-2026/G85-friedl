<text x="275.891" y="432" font-family="'DIN Condensed', 'Avenir Next Condensed', sans-serif" font-size="46" font-weight="700" fill="#16201B" letter-spacing="1">VIND OPP MOT 19 M/S.</text>
<line x1="112" y1="456" x2="752" y2="456" stroke="#C9C4B6" stroke-width="1.5"/>
<text x="112" y="490" font-family="'Avenir Next', 'Helvetica Neue', sans-serif" font-size="19" font-weight="600" fill="#16201B">Værklasse frarådet: det er meldt sterk kuling, vind opp mot 19 m/s i</text>
<text x="112" y="518" font-family="'Avenir Next', 'Helvetica Neue', sans-serif" font-size="19" font-weight="600" fill="#16201B">Tidsvinduet ditt (10:00–12:00).</text>
<text x="112" y="554" font-family="'Avenir Next', 'Helvetica Neue', sans-serif" font-size="16" font-weight="500" fill="#3D4741">Derfor foreslår vi ingen Tur nå, heller ikke den korteste. Når været er frarådet, går det</text>
<text x="112" y="577" font-family="'Avenir Next', 'Helvetica Neue', sans-serif" font-size="16" font-weight="500" fill="#3D4741">foran alt annet.</text>
<text x="112" y="612" font-family="'Avenir Next', 'Helvetica Neue', sans-serif" font-size="16" font-weight="700" fill="#16201B">Sjekk også MET sine farevarsler.</text>
