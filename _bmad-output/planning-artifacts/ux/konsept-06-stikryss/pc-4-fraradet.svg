<text x="896" y="384" font-family="'Avenir Next', 'Helvetica Neue', sans-serif" font-size="14" font-weight="500" fill="#3D4741">Værmelding for ca. 400 moh. På toppene kan det være kaldere og mer</text>
<text x="896" y="404" font-family="'Avenir Next', 'Helvetica Neue', sans-serif" font-size="14" font-weight="500" fill="#3D4741">vind.</text>
