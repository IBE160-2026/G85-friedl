<text x="932" y="490.9" font-family="'Avenir Next', 'Helvetica Neue', sans-serif" font-size="14" font-weight="500" fill="#16201B">Du har selv ansvaret for å vurdere forholdene. Værvurderingen er</text>
<text x="932" y="511.9" font-family="'Avenir Next', 'Helvetica Neue', sans-serif" font-size="14" font-weight="500" fill="#16201B">veiledende og vurderer ikke føre (snø, is, gjørme). Følg MET sine</text>
<text x="932" y="532.9" font-family="'Avenir Next', 'Helvetica Neue', sans-serif" font-size="14" font-weight="500" fill="#16201B">farevarsler.</text>
