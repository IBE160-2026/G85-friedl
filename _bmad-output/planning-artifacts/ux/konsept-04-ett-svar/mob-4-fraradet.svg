<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1267" viewBox="0 0 390 1267">
<title>Ett svar – mobil – Frarådet</title>
<desc>Værklasse frarådet: ingen Turforslag, en rolig setning og Bedre tidsvindu.</desc>
<defs></defs>
<rect x="0" y="0" width="390" height="1267" fill="#FFFFFF"/>
<rect x="0.0" y="0.0" width="390.0" height="52.0" fill="#111111"/>
<text x="20.0" y="21.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" letter-spacing="1.2">DEMOMODUS</text>
<text x="116.6" y="21.0" font-family="'Avenir Next', Avenir, 'Helvetica Neue', sans-serif" font-size="12" font-weight="500" fill="#FFFFFF">Værscenario: Sterk kuling</text>
<text x="20.0" y="40.0" font-family="'Avenir Next', Avenir, 'Helvetica Neue', sans-serif" font-size="12" font-weight="500" fill="#E6E6E6">«nå» = lør. 14. nov. 09:40</text>
<text x="20.0" y="88.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#111111">Turplanlegger</text>
<rect x="277.7" y="60.8" width="91.6" height="42.5" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
<text x="323.5" y="87.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#111111" text-anchor="middle">Endre søk</text>
<line x1="20.0" y1="112.0" x2="370.0" y2="112.0" stroke="#111111" stroke-width="2"/>
<text x="20.0" y="138.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="#5C5C5C" letter-spacing="1.2">DITT SØK</text>
<text x="20.0" y="159.5" font-family="'Avenir Next', Avenir, 'Helvetica Neue', sans-serif" font-size="15" font-weight="400" fill="#111111">Jeg</text>
<text x="49.1" y="159.5" font-family="'Avenir Next', Avenir, 'Helvetica Neue', sans-serif" font-size="15" font-weight="400" fill="#111111">vil</text>
<text x="67.7" y="159.5" font-family="'Avenir Next', Avenir, 'Helvetica Neue', sans-serif" font-size="15" font-weight="400" fill="#111111">gå</text>
<text x="88.9" y="159.5" font-family="'Avenir Next', Avenir, 'Helvetica Neue', sans-serif" font-size="15" font-weight="600" fill="#111111">i dag (lør. 14. nov.)</text>
<text x="223.1" y="159.5" font-family="'Avenir Next', Avenir, 'Helvetica Neue', sans-serif" font-size="15" font-weight="400" fill="#111111">fra</text>
<text x="244.7" y="159.5" font-family="'Avenir Next', Avenir, 'Helvetica Neue', sans-serif" font-size="15" font-weight="600" fill="#111111">10:00</text>
<text x="285.8" y="159.5" font-family="'Avenir Next', Avenir, 'Helvetica Neue', sans-serif" font-size="15" font-weight="400" fill="#111111">,</text>
<text x="293.4" y="159.5" font-family="'Avenir Next', Avenir, 'Helvetica Neue', sans-serif" font-size="15" font-weight="400" fill="#111111">har</text>
<text x="319.4" y="159.5" font-family="'Avenir Next', Avenir, 'Helvetica Neue', sans-serif" font-size="15" font-weight="600" fill="#111111">2 t</text>
<text x="337.4" y="159.5" font-family="'Avenir Next', Avenir, 'Helvetica Neue', sans-serif" font-size="15" font-weight="400" fill="#111111">,</text>
<text x="20.0" y="181.5" font-family="'Avenir Next', Avenir, 'Helvetica Neue', sans-serif" font-size="15" font-weight="400" fill="#111111">tåler</text>
<text x="54.2" y="181.5" font-family="'Avenir Next', Avenir, 'Helvetica Neue', sans-serif" font-size="15" font-weight="600" fill="#111111">Middels</text>
<text x="110.5" y="181.5" font-family="'Avenir Next', Avenir, 'Helvetica Neue', sans-serif" font-size="15" font-weight="400" fill="#111111">.</text>
<line x1="20.0" y1="200.0" x2="370.0" y2="200.0" stroke="#CFCFCB" stroke-width="1"/>
<text x="20.0" y="228.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="#111111" letter-spacing="1.2">VÆRKLASSE FRARÅDET · INGEN TURFORSLAG</text>
<text x="17.8" y="282.8" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="56" font-weight="700" fill="#111111" letter-spacing="-1.12">Vent til</text>
<text x="17.8" y="338.8" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="56" font-weight="700" fill="#111111" letter-spacing="-1.12">i morgen</text>
<text x="17.8" y="394.8" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="56" font-weight="700" fill="#111111" letter-spacing="-1.12">kl. 11.</text>
<text x="20.0" y="430.7" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="#5C5C5C" letter-spacing="1.2">BEGRUNNELSE</text>
<text x="20.0" y="450.7" font-family="'Avenir Next', Avenir, 'Helvetica Neue', sans-serif" font-size="13" font-weight="400" fill="#5C5C5C">Trykk på det understrekede for å se tallene bak.</text>
<text x="20.0" y="487.0" font-family="'Avenir Next', Avenir, 'Helvetica Neue', sans-serif" font-size="21" font-weight="400" fill="#111111">Værklasse</text>
<text x="122.0" y="487.0" font-family="'Avenir Next', Avenir, 'Helvetica Neue', sans-serif" font-size="21" font-weight="400" fill="#111111">frarådet:</text>
<text x="209.3" y="487.0" font-family="'Avenir Next', Avenir, 'Helvetica Neue', sans-serif" font-size="21" font-weight="400" fill="#111111">det</text>
<text x="246.5" y="487.0" font-family="'Avenir Next', Avenir, 'Helvetica Neue', sans-serif" font-size="21" font-weight="400" fill="#111111">er</text>
<text x="271.2" y="487.0" font-family="'Avenir Next', Avenir, 'Helvetica Neue', sans-serif" font-size="21" font-weight="400" fill="#111111">meldt</text>
<text x="20.0" y="531.0" font-family="'Avenir Next', Avenir, 'Helvetica Neue', sans-serif" font-size="21" font-weight="500" fill="#111111">sterk kuling, vind opp mot 19 m/s</text>
<rect x="20.0" y="534.4" width="323.7" height="2.0" fill="#D0301A"/>
<text x="349.0" y="531.0" font-family="'Avenir Next', Avenir, 'Helvetica Neue', sans-serif" font-size="21" font-weight="400" fill="#111111">i</text>
<text x="20.0" y="575.0" font-family="'Avenir Next', Avenir, 'Helvetica Neue', sans-serif" font-size="21" font-weight="400" fill="#111111">Tidsvinduet</text>
<text x="137.0" y="575.0" font-family="'Avenir Next', Avenir, 'Helvetica Neue', sans-serif" font-size="21" font-weight="400" fill="#111111">ditt</text>
<text x="174.0" y="575.0" font-family="'Avenir Next', Avenir, 'Helvetica Neue', sans-serif" font-size="21" font-weight="400" fill="#111111">(10:00–12:00).</text>
<rect x="20.0" y="602.7" width="350.0" height="5.0" fill="#111111"/>
<text x="20.0" y="632.7" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="#111111" letter-spacing="1.2">BEDRE TIDSVINDU</text>
<text x="20.0" y="663.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#111111">I morgen (søn. 15. nov.) fra kl.</text>
<text x="20.0" y="691.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#111111">11:00.</text>
<text x="20.0" y="714.7" font-family="'Avenir Next', Avenir, 'Helvetica Neue', sans-serif" font-size="14" font-weight="400" fill="#5C5C5C">Samme Søk: 2 t, Middels, Starttidspunkt 11:00.</text>
<rect x="20.0" y="728.7" width="350.0" height="56.0" fill="#D0301A"/>
<text x="195.0" y="763.6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">Bruk i morgen 11:00</text>
<text x="20.0" y="814.7" font-family="'Avenir Next', Avenir, 'Helvetica Neue', sans-serif" font-size="15" font-weight="500" fill="#111111">Sjekk også MET sine farevarsler.</text>
<text x="20.0" y="842.9" font-family="'Avenir Next', Avenir, 'Helvetica Neue', sans-serif" font-size="14" font-weight="400" fill="#5C5C5C">Værmelding for ca. 400 moh. På toppene kan det</text>
<text x="20.0" y="862.9" font-family="'Avenir Next', Avenir, 'Helvetica Neue', sans-serif" font-size="14" font-weight="400" fill="#5C5C5C">være kaldere og mer vind.</text>
<line x1="20.0" y1="882.7" x2="370.0" y2="882.7" stroke="#CFCFCB" stroke-width="1"/>
<text x="20.0" y="906.7" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="#111111" letter-spacing="1.2">HVORFOR INGEN TUR?</text>
<text x="20.0" y="932.2" font-family="'Avenir Next', Avenir, 'Helvetica Neue', sans-serif" font-size="15" font-weight="400" fill="#111111">Når Værklassen er frarådet, viser vi ingen</text>
<text x="20.0" y="954.2" font-family="'Avenir Next', Avenir, 'Helvetica Neue', sans-serif" font-size="15" font-weight="400" fill="#111111">Turforslag i dag, heller ikke den korteste. Frarådet</text>
<text x="20.0" y="976.2" font-family="'Avenir Next', Avenir, 'Helvetica Neue', sans-serif" font-size="15" font-weight="400" fill="#111111">går foran alt annet.</text>
<line x1="20.0" y1="1006.7" x2="370.0" y2="1006.7" stroke="#111111" stroke-width="1"/>
<text x="20.0" y="1030.7" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="#5C5C5C" letter-spacing="1.2">ANSVAR</text>
<text x="20.0" y="1056.7" font-family="'Avenir Next', Avenir, 'Helvetica Neue', sans-serif" font-size="15" font-weight="400" fill="#111111">Du har selv ansvaret for å vurdere forholdene.</text>
<text x="20.0" y="1079.7" font-family="'Avenir Next', Avenir, 'Helvetica Neue', sans-serif" font-size="15" font-weight="400" fill="#111111">Værvurderingen er veiledende og vurderer ikke</text>
<text x="20.0" y="1102.7" font-family="'Avenir Next', Avenir, 'Helvetica Neue', sans-serif" font-size="15" font-weight="400" fill="#111111">føre (snø, is, gjørme). Følg MET sine farevarsler.</text>
<line x1="20.0" y1="1125.7" x2="370.0" y2="1125.7" stroke="#CFCFCB" stroke-width="1"/>
<text x="20.0" y="1149.7" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="#5C5C5C" letter-spacing="1.2">KILDER</text>
<text x="20.0" y="1174.7" font-family="'Avenir Next', Avenir, 'Helvetica Neue', sans-serif" font-size="13" font-weight="400" fill="#5C5C5C">Værdata: MET Norway</text>
<text x="20.0" y="1195.7" font-family="'Avenir Next', Avenir, 'Helvetica Neue', sans-serif" font-size="13" font-weight="400" fill="#5C5C5C">Turstier: Turrutebasen, Kartverket</text>
<text x="20.0" y="1216.7" font-family="'Avenir Next', Avenir, 'Helvetica Neue', sans-serif" font-size="13" font-weight="400" fill="#5C5C5C">Turer: morotur.no og Fjord Norway</text>
<text x="20.0" y="1237.7" font-family="'Avenir Next', Avenir, 'Helvetica Neue', sans-serif" font-size="13" font-weight="400" fill="#5C5C5C">Bakgrunnskart: © Kartverket</text>
