<text x="1249.3" y="531.2" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="60" font-weight="300" fill="#111111" letter-spacing="-0.5">.</text>
<line x1="96.0" y1="604.0" x2="920.0" y2="604.0" stroke="#CFCFCB" stroke-width="1"/>
<text x="96.0" y="638.0" font-family="'Avenir Next', Avenir, 'Helvetica Neue', sans-serif" font-size="16" font-weight="600" fill="#111111">Tilgjengelig tid:</text>
<text x="217.4" y="638.0" font-family="'Avenir Next', Avenir, 'Helvetica Neue', sans-serif" font-size="16" font-weight="400" fill="#111111">tid til selve turen, uten reise til og fra Startpunktet. Fra 15 min til 5 t.</text>
<text x="96.0" y="668.0" font-family="'Avenir Next', Avenir, 'Helvetica Neue', sans-serif" font-size="16" font-weight="600" fill="#111111">Starttidspunkt:</text>
<text x="209.4" y="668.0" font-family="'Avenir Next', Avenir, 'Helvetica Neue', sans-serif" font-size="16" font-weight="400" fill="#111111">i dag foreslår vi «nå», rundet opp til nærmeste kvarter.</text>
<text x="96.0" y="698.0" font-family="'Avenir Next', Avenir, 'Helvetica Neue', sans-serif" font-size="16" font-weight="600" fill="#111111">Vanskelighetsgrad:</text>
<text x="243.1" y="698.0" font-family="'Avenir Next', Avenir, 'Helvetica Neue', sans-serif" font-size="16" font-weight="400" fill="#111111">den høyeste du vil ha med. Middels gir både Enkel og Middels.</text>
<rect x="96.0" y="744.0" width="264.0" height="64.0" fill="#D0301A"/>
<text x="228.0" y="783.9" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">Finn tur</text>
<text x="384.0" y="772.0" font-family="'Avenir Next', Avenir, 'Helvetica Neue', sans-serif" font-size="16" font-weight="400" fill="#5C5C5C">Samme Søk og samme Værmelding gir alltid samme svar.</text>
<text x="384.0" y="794.0" font-family="'Avenir Next', Avenir, 'Helvetica Neue', sans-serif" font-size="16" font-weight="400" fill="#5C5C5C">Du får ett tydelig svar og opptil to alternativer.</text>
