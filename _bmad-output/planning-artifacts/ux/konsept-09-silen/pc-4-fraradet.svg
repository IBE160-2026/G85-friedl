mer vind.</text><text class="s" x="96.0" y="346.0" font-size="14" fill="#0A5BC4" style="font-weight:600" text-decoration="underline">Sjekk også MET sine farevarsler.</text><rect x="940.0" y="176.0" width="436.0" height="196.0" fill="#FFFFFF" stroke="#0A5BC4" stroke-width="1.4"/><text class="m" x="964.0" y="208.0" font-size="10" fill="#58656F" style="font-weight:600;letter-spacing:1px">ALTERNATIV · BEDRE TIDSVINDU</text><text class="s" x="964.0" y="238.0" font-size="18" fill="#151E26" style="font-weight:600">i morgen (søn. 15. nov.) fra kl. 11:00</text><text class="s" x="964.0" y="262.0" font-size="13" fill="#44515B">Værklassen er bedre da. Samme 2 t, nytt Søk.</text><rect x="964.0" y="288.0" width="260.0" height="48.0" fill="#0A5BC4" rx="4"/><text class="s" x="1094.0" y="317.8" font-size="16" fill="#FFFFFF" text-anchor="middle" style="font-weight:600">Bruk i morgen 11:00</text><line x1="64.0" y1="398.0" x2="88.0" y2="398.0" stroke="#151E26" stroke-width="2"/><text class="s" x="64.0" y="416.0" font-size="12" fill="#44515B">Du har selv ansvaret for å vurdere forholdene. Værvurderingen er veiledende og vurderer ikke føre (snø, is, gjørme). Følg MET sine farevarsler.</text><text class="s" x="64.0" y="484.0" font-size="22" fill="#151E26" style="font-weight:600">Slik kom vi fram</text><text class="s" x="64.0" y="508.0" font-size="14" fill="#44515B">Alle 12 Turer i Turdatasettet går gjennom de samme trinnene. Hver linje stopper ved trinnet som fjernet Turen, med årsaken.</text><rect x="1204.0" y="462.0" width="172.0" height="44.0" fill="#FFFFFF" stroke="#151E26" stroke-width="1.2" rx="4"/><text class="s" x="1290.0" y="489.0" font-size="14" fill="#151E26" text-anchor="middle" style="font-weight:600">Skjul silen  ▴</text><text class="s" x="1376.0" y="522.0" font-size="11" fill="#58656F" text-anchor="end">På mobil er silen sammenfoldet som standard</text><rect x="64.0" y="536.0" width="1312.0" height="700.0" fill="#FFFFFF" stroke="#151E26" stroke-width="1"/><rect x="80.0" y="