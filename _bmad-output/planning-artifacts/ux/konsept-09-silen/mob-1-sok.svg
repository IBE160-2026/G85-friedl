</defs><rect x="0.0" y="0.0" width="390.0" height="1005.0" fill="#F5F7F8"/><rect x="0.0" y="0.0" width="390.0" height="1005.0" fill="url(#grid8)"/><text class="s" x="16.0" y="36.0" font-size="18" fill="#151E26" style="font-weight:600">Turplanlegger</text><text class="s" x="152.0" y="36.0" font-size="13" fill="#58656F">Moldemarka</text><rect x="16.0" y="56.0" width="358.0" height="42.0" fill="#FFFFFF" stroke="#151E26" stroke-width="1"/><rect x="16.0" y="56.0" width="16.0" height="42.0" fill="url(#hatch)"/><text class="m" x="42.0" y="74.0" font-size="11" fill="#151E26" style="font-weight:500">DEMOMODUS · Værscenario: Godt vær · «nå» = man.</text><text class="m" x="42.0" y="89.0" font-size="11" fill="#151E26" style="font-weight:500">9. nov. 13:30</text><text class="s" x="16.0" y="140.0" font-size="22" fill="#151E26" style="font-weight:600">Finn en tur som passer nå</text><text class="s" x="16.0" y="168.0" font-size="14" fill="#44515B">Si når du vil gå og hvor lang tid du har. Vi veier</text><text class="s" x="16.0" y="188.0" font-size="14" fill="#44515B">værmeldingen og foreslår opptil tre turer i</text><text class="s" x="16.0" y="208.0" font-size="14" fill="#44515B">Moldemarka som passer, og forteller hvorfor.</text><text class="s" x="16.0" y="242.0" font-size="14" fill="#151E26" style="font-weight:600">Turdag</text><rect x="16.0" y="252.0" width="358.0" height="52.0" fill="#FFFFFF" stroke="#151E26" stroke-width="1.2" rx="4"/><rect x="19.0" y="255.0" width="173.0" height="46.0" fill="#151E26" rx="3"/><text class="s" x="105.5" y="277.0" font-size="14" fill="#FFFFFF" text-anchor="middle" style="font-weight:600">I dag</text><text class="s" x="105.5" y="292.0" font-size="11" fill="#FFFFFF" text-anchor="middle">man. 9. nov.</text><text class="s" x="284.5" y="277.0" font-size="14" fill="#151E26" text-anchor="middle" style="font-weight:600">I morgen</text><text class="s" x="284.5" y="292.0" font-size="11" fill="#44515B" text-anchor="middle">tir. 10. nov.</text><text class="s" x="16.0" y="334.0" font-size="14" fill="#151E26" style="font-weight:600">Starttidspunkt</text><text class="s" x="121.3" y="334.0" font-size="12" fill="#58656F">hele kvarter, 06:00–22:00</text><rect x="16.0" y="344.0" width="358.0" height="44.0" fill="#FFFFFF" stroke="#151E26" stroke-width="1.2" rx="4"/><text class="s" x="30.0" y="372.0" font-size="15"><tspan style="fill:#151E26;font-weight:600;font-family:'SF Mono',SFMono-Regular,Menlo,Monaco,monospace">13:30</tspan><tspan style="fill:#44515B">  nå, rundet opp til kvarter</tspan></text><path d="M348 362 l6 6 l6 -6" fill="none" stroke="#151E26" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><text class="s" x="16.0" y="418.0" font-size="14" fill="#151E26" style="font-weight:600">Tilgjengelig tid</text><rect x="16.0" y="428.0" width="44.0" height="44.0" fill="#FFFFFF" stroke="#151E26" stroke-width="1.2" rx="4"/><text class="s" x="38.0" y="457.0" font-size="20" fill="#151E26" text-anchor="middle" style="font-weight:500">−</text><rect x="68.0" y="428.0" width="254.0" height="44.0" fill="#FFFFFF" stroke="#151E26" stroke-width="1.2" rx="4"/><text class="m" x="195.0" y="456.0" font-size="17" fill="#151E26" text-anchor="middle" style="font-weight:700">2 t</text><rect x="330.0" y="428.0" width="44.0" height="44.0" fill="#FFFFFF" stroke="#151E26" stroke-width="1.2" rx="4"/><text class="s" x="352.0" y="457.0" font-size="20" fill="#151E26" text-anchor="middle" style="font-weight:500">+</text><text class="s" x="16.0" y="492.0" font-size="12" fill="#44515B">Tid til selve turen, uten reise til og fra Startpunktet. Steg på 15</text><text class="s" x="16.0" y="509.0" font-size="12" fill="#44515B">min, fra 15 min til 5 t.</text><text class="s" x="16.0" y="543.0" font-size="14" fill="#151E26" style="font-weight:600">Vanskelighetsgrad</text><text class="s" x="152.1" y="543.0" font-size="12" fill="#58656F">høyeste du vil gå</text><rect x="16.0" y="553.0" width="358.0" height="44.0" fill="#FFFFFF" stroke="#151E26" stroke-width="1.2" rx="4"/><text class="s" x="75.7" y="580.0" font-size="14" fill="#151E26" text-anchor="middle" style="font-weight:500">Enkel</text><rect x="138.3" y="556.0" width="113.3" height="38.0" fill="#151E26" rx="3"/><text class="s" x="195.0" y="580.0" font-size="14" fill="#FFFFFF" text-anchor="middle" style="font-weight:600">Middels</text><text class="s" x="314.3" y="580.0" font-size="14" fill="#151E26" text-anchor="middle" style="font-weight:500">Krevende</text><text class="s" x="16.0" y="627.0" font-size="14" fill="#151E26" style="font-weight:600">Opplevelsespreferanser</text><text class="s" x="191.8" y="627.0" font-size="12" fill="#58656F">valgfritt, flere mulig</text><rect x="16.0" y="637.0" width="116.0" height="44.0" fill="#FFFFFF" stroke="#151E26" stroke-width="1.2" rx="4"/><rect x="30.0" y="650.0" width="18.0" height="18.0" fill="#FFFFFF" stroke="#151E26" stroke-width="1.4" rx="2"/><text class="s" x="58.0" y="664.0" font-size="15" fill="#151E26" style="font-weight:500">utsikt</text><rect x="144.0" y="637.0" width="116.0" height="44.0" fill="#FFFFFF" stroke="#151E26" stroke-width="1.2" rx="4"/><rect x="158.0" y="650.0" width="18.0" height="18.0" fill="#FFFFFF" stroke="#151E26" stroke-width="1.4" rx="2"/><text class="s" x="186.0" y="664.0" font-size="15" fill="#151E26" style="font-weight:500">vann</text><rect x="16.0" y="711.0" width="358.0" height="52.0" fill="#0A5BC4" rx="4"/><text class="s" x="195.0" y="743.1" font-size="17" fill="#FFFFFF" text-anchor="middle" style="font-weight:600">Finn tur</text><rect x="16.0" y="783.0" width="358.0" height="84.0" fill="#FFFFFF" stroke="#151E26" stroke-width="1"/><text class="s" x="30.0" y="807.0" font-size="15" fill="#151E26" style="font-weight:600">Slik virker silen</text><text class="s" x="360.0" y="807.0" font-size="13" fill="#0A5BC4" text-anchor="end" style="font-weight:600">Vis  ▾</text><text class="s" x="30.0" y="829.0" font-size="12" fill="#44515B">12 Turer → vær → Turtid ≤ 2 t → Vanskelighetsgrad ≤</text><text class="s" x="30.0" y="846.0" font-size="12" fill="#44515B">Middels → rangering → opptil 3</text><line x1="16.0" y1="899.0" x2="374.0" y2="899.0" stroke="#151E26" stroke-width="1"/><text class="s" x="16.0" y="921.0" font-size="12" fill="#44515B">Værdata: MET Norway</text><text class="s" x="16.0" y="939.0" font-size="12" fill="#44515B">Turstier: Turrutebasen, Kartverket</text><text class="s" x="16.0" y="957.0" font-size="12" fill="#44515B">Turer: morotur.no og Fjord Norway</text><text class="s" x="16.0" y="975.0" font-size="12" fill="#44515B">Bakgrunnskart: © Kartverket</text><line x1="0.0" y1="844.0" x2="390.0" y2="844.0" stroke="#58656F" stroke-width="1" stroke-dasharray="5 4"/><rect x="278.0" y="826.0" width="104.0" height="16.0" fill="#F5F7F8"/><text class="m" x="380.0" y="838.0" font-size="10.5" fill="#58656F" text-anchor="end">skjermkant 844</text></svg>