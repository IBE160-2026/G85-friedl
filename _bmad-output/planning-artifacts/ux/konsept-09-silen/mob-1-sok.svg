<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1005" viewBox="0 0 390 1005"><title>Turplanlegger · Silen · Mobil · Søk</title><style>.s{font-family:'Avenir Next','Helvetica Neue',Helvetica,Arial,sans-serif}.m{font-family:'SF Mono',SFMono-Regular,Menlo,Monaco,monospace}</style><defs>
