le="font-weight:600">I morgen</text><text class="s" x="454.0" y="310.0" font-size="11" fill="#44515B" text-anchor="middle">tir. 10. nov.</text><text class="s" x="64.0" y="352.0" font-size="14" fill="#151E26" style="font-weight:600">Starttidspunkt</text><text class="s" x="169.3" y="352.0" font-size="12" fill="#58656F">hele kvarter, 06:00–22:00</text><rect x="64.0" y="362.0" width="520.0" height="44.0" fill="#FFFFFF" stroke="#151E26" stroke-width="1.2" rx="4"/><text class="s" x="78.0" y="390.0" font-size="15"><tspan style="fill:#151E26;font-weight:600;font-family:'SF Mono',SFMono-Regular,Menlo,Monaco,monospace">13:30</tspan><tspan style="fill:#44515B">  nå, rundet opp til kvarter</tspan></text><path d="M558 380 l6 6 l6 -6" fill="none" stroke="#151E26" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><text class="s" x="64.0" y="436.0" font-size="14" fill="#151E26" style="font-weight:600">Tilgjengelig tid</text><rect x="64.0" y="446.0" width="44.0" height="44.0" fill="#FFFFFF" stroke="#151E26" stroke-width="1.2" rx="4"/><text class="s" x="86.0" y="475.0" font-size="20" fill="#151E26" text-anchor="middle" style="font-weight:500">−</text><rect x="116.0" y="446.0" width="416.0" height="44.0" fill="#FFFFFF" stroke="#151E26" stroke-width="1.2" rx="4"/><text class="m" x="324.0" y="474.0" font-size="17" fill="#151E26" text-anchor="middle" style="font-weight:700">2 t</text><rect x="540.0" y="446.0" width="44.0" height="44.0" fill="#FFFFFF" stroke="#151E26" stroke-width="1.2" rx="4"/><text class="s" x="562.0" y="475.0" font-size="20" fill="#151E26" text-anchor="middle" style="font-weight:500">+</text><text class="s" x="64.0" y="510.0" font-size="12" fill="#44515B">Tid til selve turen, uten reise til og fra Startpunktet. Steg på 15 min, fra 15 min til 5 t.</text><text class="s" x="64.0" y="544.0" font-size="14" fill="#151E26" style="font-weight:600">Vanskelighetsgrad</text><text class="s" x="200.1" y="544.0" font-size="12" fill="#58656F">høyeste du vil gå</text>