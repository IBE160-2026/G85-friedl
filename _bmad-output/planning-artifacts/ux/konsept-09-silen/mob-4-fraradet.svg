</defs><rect x="0.0" y="0.0" width="390.0" height="930.0" fill="#F5F7F8"/><rect x="0.0" y="0.0" width="390.0" height="930.0" fill="url(#grid8)"/><text class="s" x="16.0" y="36.0" font-size="18" fill="#151E26" style="font-weight:600">Turplanlegger</text><text class="s" x="152.0" y="36.0" font-size="13" fill="#58656F">Moldemarka</text><rect x="16.0" y="56.0" width="358.0" height="42.0" fill="#FFFFFF" stroke="#151E26" stroke-width="1"/><rect x="16.0" y="56.0" width="16.0" height="42.0" fill="url(#hatch)"/><text class="m" x="42.0" y="74.0" font-size="11" fill="#151E26" style="font-weight:500">DEMOMODUS · Værscenario: Sterk kuling · «nå» =</text><text class="m" x="42.0" y="89.0" font-size="11" fill="#151E26" style="font-weight:500">lør. 14. nov. 09:40</text><rect x="16.0" y="110.0" width="358.0" height="60.0" fill="#FFFFFF" stroke="#D3DADF" stroke-width="1"/><text class="s" x="28.0" y="134.0" font-size="14" fill="#151E26" style="font-weight:600">I dag 10:00 · 2 t · Middels</text><text class="s" x="28.0" y="154.0" font-size="12" fill="#44515B">lør. 14. nov. · Tidsvindu 10:00–12:00</text><rect x="282.0" y="118.0" width="84.0" height="44.0" fill="#FFFFFF" stroke="#151E26" stroke-width="1.2" rx="4"/><text class="s" x="324.0" y="145.0" font-size="14" fill="#151E26" text-anchor="middle" style="font-weight:600">Endre</text><rect x="16.0" y="184.0" width="358.0" height="250.0" fill="#FFFFFF" stroke="#151E26" stroke-width="1.2"/><rect x="16.0" y="184.0" width="8.0" height="250.0" fill="url(#hatch)"/><rect x="38.0" y="202.0" width="149.9" height="26.0" fill="#FFFFFF" stroke="#151E26" stroke-width="1" rx="2"/><rect x="45.0" y="209.0" width="12.0" height="12.0" fill="url(#hatch)" stroke="#151E26" stroke-width="1.4"/><text class="s" x="64.0" y="219.5" font-size="12" fill="#151E26" style="font-weight:600">Værklasse frarådet</text><text class="s" x="38.0" y="266.0" font-size="20" fill="#151E26" style="font-weight:600">Ingen Turforslag i dag mellom</text><text class="s" x="38.0" y="292.0" font-size="20" fill="#151E26" style="font-weight:600">10:00 og 12:00</text><text class="s" x="38.0" y="320.0" font-size="14" fill="#151E26">Værklasse frarådet: det er meldt sterk kuling,</text><text class="s" x="38.0" y="340.0" font-size="14" fill="#151E26">vind opp mot 19 m/s i Tidsvinduet ditt</text><text class="s" x="38.0" y="360.0" font-size="14" fill="#151E26">(10:00–12:00).</text><text class="s" x="38.0" y="382.0" font-size="11.5" fill="#44515B">Værmelding for ca. 400 moh. På toppene kan det være</text><text class="s" x="38.0" y="399.0" font-size="11.5" fill="#44515B">kaldere og mer vind.</text><text class="s" x="38.0" y="425.0" font-size="13" fill="#0A5BC4" style="font-weight:600" text-decoration="underline">Sjekk også MET sine farevarsler.</text><rect x="16.0" y="446.0" width="358.0" height="132.0" fill="#FFFFFF" stroke="#0A5BC4" stroke-width="1.4"/><text class="m" x="30.0" y="470.0" font-size="10" fill="#58656F" style="font-weight:600;letter-spacing:1px">ALTERNATIV · BEDRE TIDSVINDU</text><text class="s" x="30.0" y="494.0" font-size="15" fill="#151E26" style="font-weight:600">i morgen (søn. 15. nov.) fra kl. 11:00</text><text class="s" x="30.0" y="514.0" font-size="12" fill="#44515B">Værklassen er bedre da. Samme 2 t.</text><rect x="30.0" y="524.0" width="330.0" height="44.0" fill="#0A5BC4" rx="4"/><text class="s" x="195.0" y="551.4" font-size="15" fill="#FFFFFF" text-anchor="middle" style="font-weight:600">Bruk i morgen 11:00</text><rect x="16.0" y="590.0" width="358.0" height="84.0" fill="#FFFFFF" stroke="#151E26" stroke-width="1"/><text class="s" x="30.0" y="614.0" font-size="15" fill="#151E26" style="font-weight:600">Slik kom vi fram</text><text class="s" x="360.0" y="614.0" font-size="13" fill="#0A5BC4" text-anchor="end" style="font-weight:600">Vis silen  ▾</text><text class="m" x="30.0" y="646.0" font-size="18" fill="#151E26" style="font-weight:700">12</text><text class="s" x="30.0" y="664.0" font-size="11.5" fill="#44515B">Turer</text><text class="s" x="80.0" y="644.0" font-size="16" fill="#58656F">›</text><text class="m" x="96.0" y="646.0" font-size="18" fill="#151E26" style="font-weight:700">0</text><text class="s" x="96.0" y="664.0" font-size="11.5" fill="#44515B">vær</text><text class="s" x="146.0" y="644.0" font-size="16" fill="#58656F">›</text><text class="m" x="162.0" y="646.0" font-size="18" fill="#151E26" style="font-weight:700">–</text><text class="s" x="162.0" y="664.0" font-size="11.5" fill="#44515B">tid</text><text class="s" x="212.0" y="644.0" font-size="16" fill="#58656F">›</text><text class="m" x="228.0" y="646.0" font-size="18" fill="#151E26" style="font-weight:700">–</text><text class="s" x="228.0" y="664.0" font-size="11.5" fill="#44515B">grad</text><text class="s" x="278.0" y="644.0" font-size="16" fill="#58656F">›</text><text class="m" x="294.0" y="646.0" font-size="18" fill="#0A5BC4" style="font-weight:700">0</text><text class="s" x="294.0" y="664.0" font-size="11.5" fill="#44515B">ut</text><text class="s" x="16.0" y="696.0" font-size="12.5" fill="#44515B">Silen stoppet alle 12 Turer ved vær, før trinn 1. Det er riktig</text><text class="s" x="16.0" y="714.0" font-size="12.5" fill="#44515B">svar, ikke en feil.</text><line x1="16.0" y1="744.0" x2="40.0" y2="744.0" stroke="#151E26" stroke-width="2"/><text class="s" x="16.0" y="762.0" font-size="12" fill="#44515B">Du har selv ansvaret for å vurdere forholdene.</text><text class="s" x="16.0" y="779.0" font-size="12" fill="#44515B">Værvurderingen er veiledende og vurderer ikke føre (snø, is,</text><text class="s" x="16.0" y="796.0" font-size="12" fill="#44515B">gjørme). Følg MET sine farevarsler.</text><line x1="16.0" y1="824.0" x2="374.0" y2="824.0" stroke="#151E26" stroke-width="1"/><text class="s" x="16.0" y="846.0" font-size="12" fill="#44515B">Værdata: MET Norway</text><text class="s" x="16.0" y="864.0" font-size="12" fill="#44515B">Turstier: Turrutebasen, Kartverket</text><text class="s" x="16.0" y="882.0" font-size="12" fill="#44515B">Turer: morotur.no og Fjord Norway</text><text class="s" x="16.0" y="900.0" font-size="12" fill="#44515B">Bakgrunnskart: © Kartverket</text><line x1="0.0" y1="844.0" x2="390.0" y2="844.0" stroke="#58656F" stroke-width="1" stroke-dasharray="5 4"/><rect x="278.0" y="826.0" width="104.0" height="16.0" fill="#F5F7F8"/><text class="m" x="380.0" y="838.0" font-size="10.5" fill="#58656F" text-anchor="end">skjermkant 844</text></svg>