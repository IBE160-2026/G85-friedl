<svg xmlns="http://www.w3.org/2000/svg" width="390" height="930" viewBox="0 0 390 930"><title>Turplanlegger · Silen · Mobil · Frarådet</title><style>.s{font-family:'Avenir Next','Helvetica Neue',Helvetica,Arial,sans-serif}.m{font-family:'SF Mono',SFMono-Regular,Menlo,Monaco,monospace}</style><defs>
