rådet: det er meldt sterk</text><text x="32.0" y="550.0" font-family="'Iowan Old Style', Charter, Georgia, serif" font-size="16.5" fill="#1D2B4A" font-style="italic">kuling, vind opp mot 19 m/s i Tidsvinduet</text><text x="32.0" y="572.0" font-family="'Iowan Old Style', Charter, Georgia, serif" font-size="16.5" fill="#1D2B4A" font-style="italic">ditt (10:00–12:00).»</text><line x1="32.0" y1="596.0" x2="358.0" y2="596.0" stroke="#4F5770" stroke-width="1" stroke-dasharray="2 4"/><text x="32.0" y="618.0" font-family="Menlo, 'SF Mono', Monaco, monospace" font-size="10" fill="#4F5770" font-weight="bold" letter-spacing="1">TID</text><text x="32.0" y="636.0" font-family="Menlo, 'SF Mono', Monaco, monospace" font-size="14" fill="#1D2B4A">Tidsvindu 10:00–12:00</text><text x="358.0" y="632.0" font-family="Menlo, 'SF Mono', Monaco, monospace" font-size="18" fill="#1D2B4A" font-weight="bold" text-anchor="end">✓</text><rect x="22.0" y="645.0" width="346.0" height="40.0" rx="0" fill="#F7E4DB" stroke="none" stroke-width="1"/><text x="32.0" y="660.0" font-family="Menlo, 'SF Mono', Monaco, monospace" font-size="10" fill="#4F5770" font-weight="bold" letter-spacing="1">VÆR</text><text x="61.1" y="660.0" font-family="'Iowan Old Style', Charter, Georgia, serif" font-size="11.5" fill="#4F5770">sterk kuling</text><text x="32.0" y="678.0" font-family="Menlo, 'SF Mono', Monaco, monospace" font-size="14" fill="#1D2B4A">frarådet · 19 m/s</text><text x="358.0" y="674.0" font-family="Menlo, 'SF Mono', Monaco, monospace" font-size="13" fill="#B5321A" font-weight="bold" text-anchor="end">✗ Frarådet</text><text x="32.0" y="702.0" font-family="Menlo, 'SF Mono', Monaco, monospace" font-size="10" fill="#4F5770" font-weight="bold" letter-spacing="1">GRAD</text><text x="32.0" y="720.0" font-family="Menlo, 'SF Mono', Monaco, monospace" font-size="14" fill="#4F5770">Vanskelighetsgrad</text><text x="358.0" y="716.0" font-family="Menlo, 'SF Mono', Monaco, monospace" font-size="13" fill="#4F5770" font-weight="bold" text-anchor="end">ikke regnet</text><text x="32.0" y="744.0" font-family="Menlo, 'SF Mono', Monaco, monospace" font-size="10" fill="#4F5770" font-weight="bold" letter-spacing="1">ØNSKER</text><text x="32.0" y="762.0" font-family="Menlo, 'SF Mono', Monaco, monospace" font-size="14" fill="#4F5770">Opplevelsespreferanser</text><text x="358.0" y="758.0" font-family="Menlo, 'SF Mono', Monaco, monospace" font-size="13" fill="#4F5770" font-weight="bold" text-anchor="end">ikke regnet</text><text x="32.0" y="786.0" font-family="Menlo, 'SF Mono', Monaco, monospace" font-size="10" fill="#4F5770" font-weight="bold" letter-spacing="1">LYS</text><text x="32.0" y="804.0" font-family="Menlo, 'SF Mono', Monaco, monospace" font-size="14" fill="#4F5770">Mørkegrense</text><text x="358.0" y="800.0" font-family="Menlo, 'SF Mono', Monaco, monospace" font-size="13" fill="#4F5770" font-weight="bold" text-anchor="end">ikke regnet</text><line x1="32.0" y1="818.0" x2="358.0" y2="818.0" stroke="#1D2B4A" stroke-width="1.2"/><line x1="32.0" y1="822.0" x2="358.0" y2="822.0" stroke="#1D2B4A" stroke-width="1.2"/><text x="32.0" y="850.0" font-family="Menlo, 'SF Mono', Monaco, monospace" font-size="21" fill="#1D2B4A" font-weight="bold">=</text><text x="56.0" y="850.0" font-family="'Iowan Old Style', Charter, Georgia, serif" font-size="20" fill="#1D2B4A" font-weight="bold">Ingen tur 10:00–12:00.</text><text x="56.0" y="871.0" font-family="'Iowan Old Style', Charter, Georgia, serif" font-size="13.5" fill="#4F5770">Frarådet går foran alt. Sjekk også</text><text x="56.0" y="892.0" font-family="'Iowan Old Style', Charter, Georgia, serif" font-size="13.5" fill="#4F5770">MET sine farevarsler.</text><rect x="16.0" y="936.0" width="358.0" height="100.0" rx="0" fill="none" stroke="#1D2B4A" stroke-width="1"/><text x="28.0" y="962.0" font-family="'Iowan Old Style', Charter, Georgia, serif" font-size="13.5" fill="#1D2B4A">Du har selv ansvaret for å vurdere forholdene.</text><text x="28.0" y="981.0" font-family="'Iowan Old Style', Charter, Georgia, serif" font-size="13.5" fill="#1D2B4A">Værvurderingen er veiledende og vurderer ikke</text><text x="28.0" y="1000.0" font-family="'Iowan Old Style', Charter, Georgia, serif" font-size="13.5" fill="#1D2B4A">føre (snø, is, gjørme). Følg MET sine</text><text x="28.0" y="1019.0" font-family="'Iowan Old Style', Charter, Georgia, serif" font-size="13.5" fill="#1D2B4A">farevarsler.</text><line x1="16.0" y1="1056.0" x2="374.0" y2="1056.0" stroke="#1D2B4A" stroke-width="1"/><text x="16.0" y="1078.0" font-family="Menlo, 'SF Mono', Monaco, monospace" font-size="11" fill="#4F5770">Værdata: MET Norway · Bakgrunnskart: © Kartverket</text><text x="16.0" y="1095.0" font-family="Menlo, 'SF Mono', Monaco, monospace" font-size="11" fill="#4F5770">Turstier: Turrutebasen, Kartverket</text><text x="16.0" y="1112.0" font-family="Menlo, 'SF Mono', Monaco, monospace" font-size="11" fill="#4F5770">Turer: morotur.no og Fjord Norway</text><line x1="0.0" y1="844.0" x2="390.0" y2="844.0" stroke="#B5321A" stroke-width="1" stroke-dasharray="5 4"/><text x="386.0" y="840.0" font-family="Menlo, 'SF Mono', Monaco, monospace" font-size="10" fill="#B5321A" transform="rotate(-90 386 840)">skjermkant 844</text></svg>