e="15" fill="#4F5770">hele kvarter, 06:00–22:00</text><line x1="80.0" y1="482.0" x2="776.0" y2="482.0" stroke="#CBC2AF" stroke-width="1" stroke-dasharray="2 4"/><text x="80.0" y="530.0" font-family="'Iowan Old Style', Charter, Georgia, serif" font-size="19" fill="#1D2B4A" font-weight="bold">Tilgjengelig tid</text><rect x="308.0" y="500.0" width="52.0" height="48.0" rx="0" fill="#FCFAF5" stroke="#1D2B4A" stroke-width="1.5"/><text x="334.0" y="533.0" font-family="Menlo, 'SF Mono', Monaco, monospace" font-size="24" fill="#1D2B4A" font-weight="bold" text-anchor="middle">−</text><rect x="360.0" y="500.0" width="140.0" height="48.0" rx="0" fill="#FCFAF5" stroke="#1D2B4A" stroke-width="1.5"/><text x="430.0" y="532.0" font-family="Menlo, 'SF Mono', Monaco, monospace" font-size="20" fill="#1D2B4A" font-weight="bold" text-anchor="middle">2 t</text><rect x="500.0" y="500.0" width="52.0" height="48.0" rx="0" fill="#FCFAF5" stroke="#1D2B4A" stroke-width="1.5"/><text x="526.0" y="533.0" font-family="Menlo, 'SF Mono', Monaco, monospace" font-size="24" fill="#1D2B4A" font-weight="bold" text-anchor="middle">+</text><text x="570.0" y="522.0" font-family="'Iowan Old Style', Charter, Georgia, serif" font-size="15" fill="#4F5770">15 min–5 t, steg på 15 min</text><text x="308.0" y="576.0" font-family="'Iowan Old Style', Charter, Georgia, serif" font-size="15" fill="#4F5770" font-style="italic">Tid til selve turen, uten reise til og fra Startpunktet.</text><line x1="80.0" y1="598.0" x2="776.0" y2="598.0" stroke="#CBC2AF" stroke-width="1" stroke-dasharray="2 4"/><text x="80.0" y="640.0" font-family="'Iowan Old Style', Charter, Georgia, serif" font-size="19" fill="#1D2B4A" font-weight="bold">Vanskelighetsgrad</text><rect x="308.0" y="610.0" width="120.0" height="48.0" rx="0" fill="#FCFAF5" stroke="#1D2B4A" stroke-width="1.5"/><text x="368.0" y="639.5" font-family="'Iowan Old Style', Charter, Georgia, serif" font-size="16" fill="#1D2B4A" text-anchor="middle">Enkel</text><rect x="428.0" y="610.0" width="120.0" height="48.0" rx="0" fill="#1D2B4A" stroke="#1D2B4A" stroke-width="1.5"/><text x="488.0" y="639.5" font-family="'Iowan Old Style', Charter, Georgia, serif" font-size="16" fill="#FFFFFF" font-weight="bold" text-anchor="middle">Middels</text><rect x="548.0" y="610.0" width="120.0" height="48.0" rx="0" fill="#FCFAF5" stroke="#1D2B4A" stroke-width="1.5"/><text x="608.0" y="639.5" font-family="'Iowan Old Style', Charter, Georgia, serif" font-size="16" fill="#1D2B4A" text-anchor="middle">Krevende</text><text x="308.0" y="684.0" font-family="'Iowan Old Style', Charter, Georgia, serif" font-size="15" fill="#4F5770" font-style="italic">Den høyeste du vil gå. Lettere turer er med.</text><line x1="80.0" y1="704.0" x2="776.0" y2="704.0" stroke="#CBC2AF" stroke-width="1" stroke-dasharray="2 4"/><text x="80.0" y="734.0" font-family="'Iowan Old Style', Charter, Georgia, serif" font-size="19" fill="#1D2B4A" font-weight="bold">Opplevelses-</text><text x="80.0" y="758.0" font-family="'Iowan Old Style', Charter, Georgia, serif" font-size="19" fill="#1D2B4A" font-weight="bold">preferanser</text><rect x="308.0" y="706.0" width="130.0" height="44.0" rx="0" fill="none" stroke="none" stroke-width="1"/><rect x="312.0" y="716.0" width="24.0" height="24.0" rx="3" fill="#FCFAF5" stroke="#1D2B4A" stroke-width="1.5"/><text x="346.0" y="734.0" font-family="'Iowan Old Style', Charter, Georgia, serif" font-size="17" fill="#1D2B4A">utsikt</text><rect x="452.0" y="716.0" width="24.0" height="24.0" rx="3" fill="#FCFAF5" stroke="#1D2B4A" stroke-width="1.5"/><text x="486.0" y="734.0" font-family="'Iowan Old Style', Charter, Georgia, serif" font-size="17" fill="#1D2B4A">vann</text><text x="570.0" y="734.0" font-family="'Iowan Old Style', Charter, Georgia, serif" font-size="15" fill="#4F5770">valgfritt, du kan velge begge</text><line x1="80.0" y1="790.0" x2="776.0" y2="790.0" stroke="#1D2B4A" stroke-width="1.2"/><line x1="80.0" y1="794.0" x2="776.0" y2="794.0" stroke="#1D2B4A" stroke-wi