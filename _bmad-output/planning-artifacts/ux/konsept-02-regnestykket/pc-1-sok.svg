">Værklasse i Tidsvinduet ditt</text><rect x="1340.0" y="427.0" width="22.0" height="20.0" rx="2" fill="none" stroke="#4F5770" stroke-width="1"/><line x1="960.0" y1="454.0" x2="1364.0" y2="454.0" stroke="#CBC2AF" stroke-width="1" stroke-dasharray="2 4"/><text x="884.0" y="484.0" font-family="Menlo, 'SF Mono', Monaco, monospace" font-size="11" fill="#4F5770" font-weight="bold" letter-spacing="1">GRAD</text><text x="960.0" y="484.0" font-family="Menlo, 'SF Mono', Monaco, monospace" font-size="14.5" fill="#1D2B4A">Turens grad ≤ Vanskelighetsgrad</text><rect x="1340.0" y="469.0" width="22.0" height="20.0" rx="2" fill="none" stroke="#4F5770" stroke-width="1"/><line x1="960.0" y1="496.0" x2="1364.0" y2="496.0" stroke="#CBC2AF" stroke-width="1" stroke-dasharray="2 4"/><text x="884.0" y="526.0" font-family="Menlo, 'SF Mono', Monaco, monospace" font-size="11" fill="#4F5770" font-weight="bold" letter-spacing="1">ØNSKER</text><text x="960.0" y="526.0" font-family="Menlo, 'SF Mono', Monaco, monospace" font-size="14.5" fill="#1D2B4A">treffer Opplevelsespreferansene?</text><rect x="1340.0" y="511.0" width="22.0" height="20.0" rx="2" fill="none" stroke="#4F5770" stroke-width="1"/><line x1="960.0" y1="538.0" x2="1364.0" y2="538.0" stroke="#CBC2AF" stroke-width="1" stroke-dasharray="2 4"/><text x="884.0" y="568.0" font-family="Menlo, 'SF Mono', Monaco, monospace" font-size="11" fill="#4F5770" font-weight="bold" letter-spacing="1">LYS</text><text x="960.0" y="568.0" font-family="Menlo, 'SF Mono', Monaco, monospace" font-size="14.5" fill="#1D2B4A">ender ≤ 30 min før solnedgang</text><rect x="1340.0" y="553.0" width="22.0" height="20.0" rx="2" fill="none" stroke="#4F5770" stroke-width="1"/><line x1="960.0" y1="580.0" x2="1364.0" y2="580.0" stroke="#CBC2AF" stroke-width="1" stroke-dasharray="2 4"/><line x1="960.0" y1="614.0" x2="1364.0" y2="614.0" stroke="#1D2B4A" stroke-width="1.2"/><line x1="960.0" y1="618.0" x2="1364.0" y2="618.0" stroke="#1D2B4A" stroke-width="1.2"/><text x="932.0" y="648.0" font-family="Menlo, 'SF Mono', Monaco, monospace" font-size="22" fill="#1D2B4A" font-weight="bold">=</text><text x="960.0" y="648.0" font-family="'Iowan Old Style', Charter, Georgia, serif" font-size="18" fill="#1D2B4A" font-weight="bold">Turforslag, eller et Alternativ</text><text x="960.0" y="672.0" font-family="'Iowan Old Style', Charter, Georgia, serif" font-size="18" fill="#1D2B4A" font-weight="bold">når ingenting går opp.</text><text x="884.0" y="710.0" font-family="'Iowan Old Style', Charter, Georgia, serif" font-size="15" fill="#4F5770" font-style="italic">Sola går ned 15:59 i dag, så mørkegrensen er 15:29.</text><text x="884.0" y="732.0" font-family="'Iowan Old Style', Charter, Georgia, serif" font-size="15" fill="#4F5770" font-style="italic">Samme Søk og samme Værmelding gir alltid samme svar.</text><line x1="48.0" y1="926.0" x2="1392.0" y2="926.0" stroke="#1D2B4A" stroke-width="1"/><text x="48.0" y="954.0" font-family="Menlo, 'SF Mono', Monaco, monospace" font-size="12.5" fill="#4F5770">Værdata: MET Norway · Turstier: Turrutebasen, Kartverket · Turer: morotur.no og Fjord Norway · Bakgrunnskart: © Kartverket</text></svg>