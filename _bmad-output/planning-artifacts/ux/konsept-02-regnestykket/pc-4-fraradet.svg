<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="941" viewBox="0 0 1440 941"><title>Regnestykket – Frarådet (PC)</title><desc>Kvittering der værlinja stopper regnestykket, med Bedre tidsvindu som Alternativ.</desc><defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse"><line x1="0" y1="3" x2="6" y2="3" stroke="#1D2B4A" stroke-width="0.6" opacity="0.35"/></pattern><pattern id="town" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#1D2B4A" stroke-width="0.6" opacity="0.22"/></pattern></defs><rect width="1440" height="941" fill="#F3EDE1"/><text x="48.0" y="46.0" font-family="'Iowan Old Style', Charter, Georgia, serif" font-size="26" fill="#1D2B4A" font-weight="bold">Turplanlegger</text><text x="232.0" y="46.0" font-family="Menlo, 'SF Mono', Monaco, monospace" font-size="13" fill="#4F5770" letter-spacing="1">Moldemarka</text><g transform="rotate(-1.2 1140 35)"><rect x="887.2" y="18.0" width="504.8" height="34.0" rx="3" fill="none" stroke="#1D2B4A" stroke-width="1.6"/><rect x="890.2" y="21.0" width="498.8" height="28.0" rx="2" fill="none" stroke="#1D2B4A" stroke-width="0.7"/><text x="901.2" y="40.0" font-family="Menlo, 'SF Mono', Monaco, monospace" font-size="12" fill="#1D2B4A" font-weight="bold">DEMOMODUS · Værscenario: Sterk kuling · «nå» = lør. 14. nov. 09:40</text></g><line x1="48.0" y1="72.0" x2="1392.0" y2="72.0" stroke="#1D2B4A" stroke-width="1.2"/><text x="48.0" y="140.0" font-family="'Iowan Old Style', Charter, Georgia, serif" font-size="44" fill="#1D2B4A" font-weight="bold">I dag går ikke regnestykket opp.</text><text x="48.0" y="176.0" font-family="'Iowan Old Style', Charter, Georgia, serif" font-size="17" fill="#4F5770">Været stopper utregningen før noen Tur blir vurdert. I morgen ser det bedre ut.</text><path d="M48,208 L872,208 L872,729 L868.0,724 L864.0,729 L860.0,724 L856.0,729 L852.0,724 L848.0,729 L844.0,724 L840.0,729 L836.0,724 L832.0,729 L828.0