.5" font-family="Menlo, 'SF Mono', Monaco, monospace" font-size="15" fill="#1D2B4A">Tidsvindu 10:00–12:00</text><text x="844.0" y="451.5" font-family="Menlo, 'SF Mono', Monaco, monospace" font-size="19" fill="#1D2B4A" font-weight="bold" text-anchor="end">✓</text><rect x="66.0" y="463.0" width="788.0" height="27.0" rx="0" fill="#F7E4DB" stroke="none" stroke-width="1"/><text x="76.0" y="481.5" font-family="Menlo, 'SF Mono', Monaco, monospace" font-size="10.5" fill="#4F5770" font-weight="bold" letter-spacing="1">VÆR</text><text x="168.0" y="481.5" font-family="Menlo, 'SF Mono', Monaco, monospace" font-size="15" fill="#1D2B4A">Værklasse: frarådet (vind opp mot 19 m/s)</text><text x="844.0" y="482.5" font-family="Menlo, 'SF Mono', Monaco, monospace" font-size="15" fill="#B5321A" font-weight="bold" text-anchor="end">✗ Frarådet</text><text x="76.0" y="512.5" font-family="Menlo, 'SF Mono', Monaco, monospace" font-size="10.5" fill="#4F5770" letter-spacing="1">GRAD</text><text x="168.0" y="512.5" font-family="Menlo, 'SF Mono', Monaco, monospace" font-size="15" fill="#4F5770">Vanskelighetsgrad</text><line x1="329.5" y1="508.5" x2="747.9" y2="508.5" stroke="#4F5770" stroke-width="1" stroke-dasharray="1 4"/><text x="844.0" y="512.5" font-family="Menlo, 'SF Mono', Monaco, monospace" font-size="13" fill="#4F5770" text-anchor="end" font-style="italic">ikke regnet</text><text x="76.0" y="543.5" font-family="Menlo, 'SF Mono', Monaco, monospace" font-size="10.5" fill="#4F5770" letter-spacing="1">ØNSKER</text><text x="168.0" y="543.5" font-family="Menlo, 'SF Mono', Monaco, monospace" font-size="15" fill="#4F5770">Opplevelsespreferanser</text><line x1="374.7" y1="539.5" x2="747.9" y2="539.5" stroke="#4F5770" stroke-width="1" stroke-dasharray="1 4"/><text x="844.0" y="543.5" font-family="Menlo, 'SF Mono', Monaco, monospace" font-size="13" fill="#4F5770" text-anchor="end" font-style="italic">ikke regnet</text><text x="76.0" y="574.5" font-family="Menlo, 'SF Mono', Monaco, monospace" font-size="10.5" fill="#4F5770" letter-spacing="1">LYS</text><text x="168.0" y="574.5" font-family="Menlo, 'SF Mono', Monaco, monospace" font-size="15" fill="#4F5770">Mørkegrense</text><line x1="275.3" y1="570.5" x2="747.9" y2="570.5" stroke="#4F5770" stroke-width="1" stroke-dasharray="1 4"/><text x="844.0" y="574.5" font-family="Menlo, 'SF Mono', Monaco, monospace" font-size="13" fill="#4F5770" text-anchor="end" font-style="italic">ikke regnet</text><text x="168.0" y="601.0" font-family="Menlo, 'SF Mono', Monaco, monospace" font-size="12.5" fill="#B5321A" font-weight="bold">↑ Frarådet går foran alt. Ingen Tur regnes videre i dette Tidsvinduet.</text><line x1="168.0" y1="617.0" x2="844.0" y2="617.0" stroke="#1D2B4A" stroke-width="1.2"/><line x1="168.0" y1="621.0" x2="844.0" y2="621.0" stroke="#1D2B4A" stroke-width="1.2"/><text x="138.0" y="651.0" font-family="Menlo, 'SF Mono', Monaco, monospace" font-size="24" fill="#1D2B4A" font-weight="bold">=</text><text x="168.0" y="651.0" font-family="'Iowan Old Style', Charter, Georgia, serif" font-size="22" fill="#1D2B4A" font-weight="bold">Ingen tur i dag, 10:00–12:00.</text><text x="168.0" y="673.0" font-family="'Iowan Old Style', Charter, Georgia, serif" font-size="15" fill="#4F5770">Det er et svar, ikke en feil: vinden er for sterk for tur i Moldemarka.</text><text x="168.0" y="695.0" font-family="'Iowan Old Style', Charter, Georgia, serif" font-size="15" fill="#4F5770">Sjekk også MET sine farevarsler.</text><rect x="48.0" y="757.0" width="824.0" height="74.0" rx="0" fill="none" stroke="#1D2B4A" stroke-width="1"/><text x="68.0" y="787.0" font-family="'Iowan Old Style', Charter, Georgia, serif" font-size="15" fill="#1D2B4A">Du har selv ansvaret for å vurdere forholdene. Værvurderingen er veiledende og vurderer ikke føre</text><text x="68.0" y="809.0" font-family="'Iowan Old Style', Charter, Georgia, serif" font-size="15" fill="#1D2B4A">(snø, is, gjørme). Følg MET sine farevarsler.</text><path d="M904,208 L1392,208 L1392,660 L13