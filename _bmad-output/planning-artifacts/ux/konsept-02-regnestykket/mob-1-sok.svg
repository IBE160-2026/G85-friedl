rter, Georgia, serif" font-size="16" fill="#1D2B4A">vann</text><line x1="32.0" y1="700.0" x2="358.0" y2="700.0" stroke="#1D2B4A" stroke-width="1.2"/><line x1="32.0" y1="704.0" x2="358.0" y2="704.0" stroke="#1D2B4A" stroke-width="1.2"/><rect x="32.0" y="718.0" width="326.0" height="56.0" rx="6" fill="#1D2B4A" stroke="#1D2B4A" stroke-width="1"/><text x="195.0" y="752.8" font-family="'Iowan Old Style', Charter, Georgia, serif" font-size="19" fill="#FFFFFF" font-weight="bold" text-anchor="middle">Finn tur</text><text x="16.0" y="824.0" font-family="'Iowan Old Style', Charter, Georgia, serif" font-size="20" fill="#1D2B4A" font-weight="bold">Slik regner vi</text><text x="16.0" y="864.0" font-family="Menlo, 'SF Mono', Monaco, monospace" font-size="10" fill="#4F5770" font-weight="bold" letter-spacing="1">TID</text><text x="80.0" y="864.0" font-family="Menlo, 'SF Mono', Monaco, monospace" font-size="13" fill="#1D2B4A">Turtid (uten pauser) ≤ Tilgj. tid</text><text x="16.0" y="894.0" font-family="Menlo, 'SF Mono', Monaco, monospace" font-size="10" fill="#4F5770" font-weight="bold" letter-spacing="1">VÆR</text><text x="80.0" y="894.0" font-family="Menlo, 'SF Mono', Monaco, monospace" font-size="13" fill="#1D2B4A">Værklasse i Tidsvinduet</text><text x="16.0" y="924.0" font-family="Menlo, 'SF Mono', Monaco, monospace" font-size="10" fill="#4F5770" font-weight="bold" letter-spacing="1">GRAD</text><text x="80.0" y="924.0" font-family="Menlo, 'SF Mono', Monaco, monospace" font-size="13" fill="#1D2B4A">grad ≤ Vanskelighetsgrad</text><text x="16.0" y="954.0" font-family="Menlo, 'SF Mono', Monaco, monospace" font-size="10" fill="#4F5770" font-weight="bold" letter-spacing="1">ØNSKER</text><text x="80.0" y="954.0" font-family="Menlo, 'SF Mono', Monaco, monospace" font-size="13" fill="#1D2B4A">treffer preferansene?</text><text x="16.0" y="984.0" font-family="Menlo, 'SF Mono', Monaco, monospace" font-size="10" fill="#4F5770" font-weight="bold" letter-spacing="1">LYS</text><text x="80.0" y=