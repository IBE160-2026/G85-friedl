r opptil</text><text x="16.0" y="234.0" font-family="'Iowan Old Style', Charter, Georgia, serif" font-size="15.5" fill="#1D2B4A">tre turer i Moldemarka som passer, og</text><text x="16.0" y="255.0" font-family="'Iowan Old Style', Charter, Georgia, serif" font-size="15.5" fill="#1D2B4A">forteller hvorfor.</text><path d="M16,280 L374,280 L374,796 L369.9,791 L365.9,796 L361.8,791 L357.7,796 L353.7,791 L349.6,796 L345.5,791 L341.5,796 L337.4,791 L333.3,796 L329.2,791 L325.2,796 L321.1,791 L317.0,796 L313.0,791 L308.9,796 L304.8,791 L300.8,796 L296.7,791 L292.6,796 L288.6,791 L284.5,796 L280.4,791 L276.4,796 L272.3,791 L268.2,796 L264.2,791 L260.1,796 L256.0,791 L252.0,796 L247.9,791 L243.8,796 L239.8,791 L235.7,796 L231.6,791 L227.5,796 L223.5,791 L219.4,796 L215.3,791 L211.3,796 L207.2,791 L203.1,796 L199.1,791 L195.0,796 L190.9,791 L186.9,796 L182.8,791 L178.7,796 L174.7,791 L170.6,796 L166.5,791 L162.5,796 L158.4,791 L154.3,796 L150.2,791 L146.2,796 L142.1,791 L138.0,796 L134.0,791 L129.9,796 L125.8,791 L121.8,796 L117.7,791 L113.6,796 L109.6,791 L105.5,796 L101.4,791 L97.4,796 L93.3,791 L89.2,796 L85.2,791 L81.1,796 L77.0,791 L73.0,796 L68.9,791 L64.8,796 L60.7,791 L56.7,796 L52.6,791 L48.5,796 L44.5,791 L40.4,796 L36.3,791 L32.3,796 L28.2,791 L24.1,796 L20.1,791 L16.0,796 Z" fill="#FCFAF5" stroke="#1D2B4A" stroke-width="1.5"/><text x="32.0" y="306.0" font-family="Menlo, 'SF Mono', Monaco, monospace" font-size="10.5" fill="#4F5770" font-weight="bold" letter-spacing="1.2">SØKET DITT</text><text x="32.0" y="336.0" font-family="'Iowan Old Style', Charter, Georgia, serif" font-size="16" fill="#1D2B4A" font-weight="bold">Turdag</text><rect x="32.0" y="346.0" width="186.0" height="46.0" rx="0" fill="#1D2B4A" stroke="#1D2B4A" stroke-width="1.5"/><text x="125.0" y="374.5" font-family="'Iowan Old Style', Charter, Georgia, serif" font-size="15" fill="#FFFFFF" font-weight="bold" text-anchor="middle">I dag · man. 9. nov.</text><rect x="218.0" y="346.0" width="140.0" height="46.