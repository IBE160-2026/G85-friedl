name: CI

on: push

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Installer avhengigheter
        run: npm ci

      - name: Lint
        run: npm run lint

      # Verken Vitest eller ESLint typesjekker. `next typegen` lager PageProps/LayoutProps,
      # som ellers bare finnes etter `next dev`/`next build`.
      - name: Typesjekk
        run: npx next typegen && npx tsc --noEmit

      - name: Vitest
        run: npm test

      # AD-8: testdata/vaerklasse-fasit.json kjøres både av Vitest og av kalibreringsskriptet.
      - name: Selvtest kalibreringsskript
        run: python3 scripts/kalibrering_vaerlogg.py --selvtest

      - name: Installer Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Playwright
        run: npm run test:e2e
